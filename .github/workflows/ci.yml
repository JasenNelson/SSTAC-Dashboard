name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen
      
      - name: TypeScript check
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v6

      # Node 22 (not 24): pin the Unit Tests job to Node 22 to match engines.node ("22.x"), the
      # Build/Perf jobs, and the Vercel production runtime. The Node 20 -> 24 bump introduced a v8
      # coverage memory regression that intermittently OOM-crashed the forked coverage worker with
      # `write EPIPE` / ForksPoolWorker.send / ChildProcess.emitWorkerError (recurred on #542, #543,
      # and #546 -- each cleared by a single SOP rerun, i.e. environmental, not content). Node 22 has
      # materially more coverage-memory headroom (it tolerated maxWorkers=2 historically). The
      # maxWorkers=1 cap (vitest.config), the 6 sequential shards below, and the 8GB heap are all
      # RETAINED as belt-and-suspenders -- change one variable at a time. Fallback if Node 22 ever
      # OOMs again: escalate to 8 shards (never maxWorkers=2).
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # Durable OOM fix (2026-06-12, /codex-review'd: Opus + codex gpt-5.5-xhigh GREEN).
      # The single-process v8-coverage run retains end-of-run coverage data proportional to the
      # TOTAL number of source modules covered across the whole suite, and intermittently
      # OOM-crashes the Node-24 worker with `write EPIPE` (no test summary) once the suite sits
      # near the heap ceiling -- observed on #290 and #305. maxWorkers=1 (vitest.config) and an
      # 8GB heap were ceiling-raises against a rising floor (suite + catalog grow every PR).
      # Fix: run vitest in 6 SEQUENTIAL shards -- each a FRESH node process covering ~1/6 of the
      # test files, so the retained coverage is bounded to ~1/6 and freed when the process exits.
      # Bumped 4 -> 6 on 2026-06-14/15: this lane keeps hitting the ceiling (#290, #305, and again
      # after another batch of tests landed) -- 4 shards no longer fit. STOPGAP, not a structural
      # cure: --shard splits TEST FILES not source modules and is order-sensitive, so a single
      # oversized test file (or two heavy modules co-located in one slice) can still blow a shard.
      # The durable fix (bigger-RAM runner, or move coverage off the required Unit gate into a
      # separate non-blocking job) is an owner decision. Escalation if 6 OOMs: 8 shards, never
      # maxWorkers=2 (known Node-20 OOM).
      # MUST stay a single "Unit Tests" job (not a matrix): branch protection requires the
      # "Unit Tests" check by name; a matrix would rename it to "Unit Tests (i)" and block all
      # PRs. maxWorkers=1 + the 8GB heap are retained for now (change one variable at a time).
      - name: Run unit tests (sharded -- fresh process per shard, per-shard coverage)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            echo "::group::vitest shard $i/6"
            npm run test:ci -- --shard=$i/6 --coverage.reportsDirectory=coverage/shard-$i
            echo "::endgroup::"
          done
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # vitest.config coverage.reporter already includes 'json', so each shard writes a
      # non-empty coverage/shard-N/coverage-final.json. Codecov ingests + merges the 6 files in
      # one upload (a single flags: would apply to the whole upload, so none is set). Non-blocking
      # (fail_ci_if_error:false + continue-on-error) -- coverage never fails the gate.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/shard-1/coverage-final.json,./coverage/shard-2/coverage-final.json,./coverage/shard-3/coverage-final.json,./coverage/shard-4/coverage-final.json,./coverage/shard-5/coverage-final.json,./coverage/shard-6/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 to match the Vercel deploy runtime (engines.node "22.x").
          # Build jobs must mirror production; CI cannot otherwise catch a
          # Vercel-only build/OOM failure (our GitHub build gate runs ~16GB).
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify environment variables are set
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi
          echo "✓ Environment variables are set"
      
      - name: Build application
        run: npm run build
        env:
          # Add required environment variables
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Sentry env vars (optional - build will work without them)
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # 2026-07-06: was `needs: build`, but this job starts its own `next dev` webServer
    # (playwright.config.ts) and never consumes the Production Build job's `.next` output --
    # the dependency was pure ordering, not an artifact. Depending on unit-tests instead lets
    # E2E run in parallel with Production Build / Performance Analysis / Load Testing K6
    # instead of waiting for Build to finish first (verified: E2E is the pipeline's longest
    # job and was the tail of the critical path). Trade-off: E2E can now run even if
    # Production Build later fails -- CI-minute/noise cost, not a correctness risk, since the
    # final CI Status Check aggregator still requires both build and e2e-tests to pass.
    needs: unit-tests
    # Hard backstop so a stuck step can never hang for hours (default is 360 min).
    timeout-minutes: 60
    # Run inside the OFFICIAL Playwright container so browsers + system deps are PREBAKED and apt
    # never runs in this job. Root cause of the prior intermittent ~25-min CANCELLED runs (2026-06-18,
    # confirmed from step-level timing + codex consult): `npx playwright install --with-deps` hung in
    # the apt `needrestart` post-install hook until the job hit timeout-minutes, with the test step
    # SKIPPED. The container removes that failure class entirely (no `--with-deps`, no apt).
    #   - The image tag MUST match the @playwright/test version in package-lock.json; the version-check
    #     step below fails the build if they drift (bump BOTH together on a Playwright upgrade).
    #   - `--user 1001` is the image's pwuser, required so Chromium runs WITHOUT --no-sandbox (Chromium
    #     refuses to run as root without it); `--ipc=host` is Playwright's recommended Chromium flag.
    #   - Node still pinned to 20 (e2e's known-good runtime; Node-version-sensitive work is covered by
    #     the Node-24 Unit Tests + Build jobs). setup-node overrides PATH and does not conflict with the
    #     container's bundled Node. `cache: 'npm'` is intentionally omitted to avoid a cache-perm clash
    #     under --user 1001.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright package matches the container image tag
        # Fail loudly if @playwright/test (lockfile) drifts from the container image's baked browsers.
        # EXPECTED must equal the container image tag version above.
        run: |
          EXPECTED=1.56.1
          PKG=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "lockfile @playwright/test=$PKG ; container image=v$EXPECTED"
          if [ "$PKG" != "$EXPECTED" ]; then
            echo "::error::@playwright/test $PKG != container image v$EXPECTED -- bump the mcr.microsoft.com/playwright image tag in ci.yml to match the lockfile"
            exit 1
          fi

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_HOST: 127.0.0.1
          PLAYWRIGHT_TEST_PORT: 3100
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # Admin-tier authenticated E2E (T40) is ALSO skip-safe: playwright.config.ts gates
          # the setup-admin + chromium-admin-auth projects on BOTH E2E_ADMIN_* secrets present
          # AND E2E_AUTH_ENABLED == 'true'. Forwarding these here is a prerequisite for the
          # owner-gated admin-tier activation (create admin test user + set the two secrets);
          # unset -> '' -> admin projects skip, identical to today. No behavior change until set.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Authenticated E2E is OFF by default and stays skip-safe: playwright.config.ts
          # only adds the setup + chromium-auth projects when BOTH the E2E_TEST_* secrets
          # are present AND E2E_AUTH_ENABLED == 'true'. Driven by the repo variable
          # (unset -> '' -> disabled) rather than a hard-coded branch name, so no
          # experiment-branch coupling leaks onto main. Enablement strategy is owner-gated
          # (see Lane B plan U3); a controlled proof branch may set this locally.
          E2E_AUTH_ENABLED: ${{ vars.E2E_AUTH_ENABLED }}

      # Capture the Playwright report + per-test error-context/traces on failure so
      # e2e failures (e.g. the authenticated setup login) are diagnosable from CI.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  performance-analysis:
    name: Performance & Bundle Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 to match the Vercel deploy runtime: this job also runs
          # `npm run build`, so its bundle metrics must reflect the production
          # build, and a Node-24-only build path is not left in CI.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for analysis
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .next/static/chunks/main*.js ]; then
            SHARED_SIZE=$(du -b .next/static/chunks/main*.js | awk '{sum += $1} END {printf "%.0f", sum/1024}')
            echo "**Shared JS Bundle:** ${SHARED_SIZE}KB" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f .next/BUILD_ID ]; then
            echo "**Build ID:** $(cat .next/BUILD_ID)" >> $GITHUB_STEP_SUMMARY
          fi

          TOTAL_SIZE=$(du -sb .next | awk '{printf "%.1f", $1/1024/1024}')
          echo "**Total Build Size:** ${TOTAL_SIZE}MB" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Check for performance regressions
        run: |
          # Check if shared bundle is under 250KB target
          SHARED_KB=$(du -b .next/static/chunks/main*.js 2>/dev/null | awk '{sum += $1} END {printf "%.0f", sum/1024}')
          TARGET_KB=250

          if [ "$SHARED_KB" -gt "$TARGET_KB" ]; then
            echo "⚠️ Performance Warning: Shared bundle is ${SHARED_KB}KB (target: ${TARGET_KB}KB)"
          else
            echo "✓ Performance OK: Shared bundle is ${SHARED_KB}KB (target: ${TARGET_KB}KB)"
          fi
        continue-on-error: true

  load-test:
    name: Load Testing (K6)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for K6 tests
        id: check_k6
        run: |
          if [ -f "tests/load/main.k6.js" ]; then
            echo "k6_exists=true" >> $GITHUB_OUTPUT
          else
            echo "k6_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install K6
        if: steps.check_k6.outputs.k6_exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/grafana.gpg --keyserver keyserver.ubuntu.com --recv-keys 963FA27A28213892
          echo "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main" | sudo tee -a /etc/apt/sources.list.d/grafana.list
          sudo apt-get update
          sudo apt-get install -y k6
        continue-on-error: true

      - name: Run K6 load tests
        if: steps.check_k6.outputs.k6_exists == 'true'
        run: npm run test:k6
        continue-on-error: true
        env:
          K6_VUS: 10
          K6_DURATION: 30s

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, build, e2e-tests, performance-analysis]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi

      - name: Report status to job summary
        if: always()
        run: |
          echo "## CI/CD Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & TypeScript | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Analysis | ${{ needs.performance-analysis.result }} |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------------------------
  # Guardrail tests on Windows PowerShell 5.1.
  #
  # WHY THIS JOB EXISTS. tooling/wiki/graphify_guardrail.ps1 is protected by 44 behavioural tests
  # and a 5-case smoke script, and NONE of them run in CI today: every other job here is
  # ubuntu-latest, and on Linux the guardrail tests call skipTest because shutil.which("powershell")
  # returns nothing. They therefore SKIP AND REPORT GREEN having tested nothing. Closing that
  # false-green is the entire point of this job, so its assertions are deliberately paranoid: a
  # zero exit code from `unittest` is NOT evidence, because unittest exits 0 on a fully skipped run.
  #
  # BOTH interpreters are IDENTITY-BOUND before any test runs. Neither `powershell` nor `python` is
  # ever invoked bare: a gate that closes a false green must not itself depend on PATH resolution
  # picking the interpreter it was verified against.
  #
  # This job is ADVISORY in branch protection (it is intentionally absent from status-check.needs).
  # It is BLOCKING by protocol: no hardening or first-adopter PR merges unless it is green on that
  # exact head. `main` has enforce_admins disabled and no required reviews, so that protocol rule
  # must also appear in the PR body -- it has no mechanical enforcement here.
  # ---------------------------------------------------------------------------------------------
  guardrail-tests-windows:
    name: Guardrail Tests (Windows PowerShell 5.1)
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # STEP 1 -- authenticate BOTH runtimes and bind their exact absolute paths.
      # Without this a Linux-shaped mistake, or a PATH that resolves to a different interpreter than
      # the one verified, reports green having tested nothing.
      - name: Authenticate runtimes and bind exact interpreters
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $ev = Join-Path $env:RUNNER_TEMP 'gate-evidence'
          New-Item -ItemType Directory -Path $ev -Force | Out-Null
          # Stub IMMEDIATELY. Every validation below can `exit 1`, and the upload step runs with
          # `if: always()` and `if-no-files-found: error` -- so without this the common failure path
          # leaves an EMPTY directory and the upload adds a second, misleading "no files" error on
          # top of the real one. Overwritten with the full identity once both runtimes authenticate.
          "step1_started=$((Get-Date).ToString('o'))" | Set-Content -Encoding ASCII (Join-Path $ev 'identity.txt')

          # ---- Dedicated executor evidence root, bound BEFORE any Python starts ----
          # ROOT CAUSE this addresses, stated as MEASURED rather than as first assumed.
          #
          # The defect is an ASYMMETRY between how PowerShell and Python canonicalise a Windows path
          # that carries an 8.3 short component. Measured on .NET Framework 4.8 / CPython 3.11:
          #     [IO.Path]::GetFullPath('...\LONGNA~1')  ->  '...\longnamedfolder12345'   (EXPANDS)
          #     os.path.abspath(r'...\LONGNA~1')        ->  '...\LONGNA~1'               (does NOT)
          # So the same physical directory reaches an ordinal comparison as two different strings.
          # check_orphans.ps1 canonicalises its runtime root with GetFullPath and then ordinal-matches
          # the result against a fixture command line that Python built from the UN-expanded form; the
          # parent-role check throws, the helper exits 1, and the test's assertEqual(returncode, 0)
          # records a FAILURE. That is why the hosted run reported failures=9 with errors=0, and why
          # those were never eight product custody defects.
          #
          # An earlier revision of this comment claimed GetFullPath does NOT expand 8.3. That is
          # false on .NET Framework, and the correction below never depended on it being true.
          #
          # The fix is to remove the ambiguity at the source: bind ONE canonical long root, so every
          # Python-derived path descends lexically from it, GetFullPath is a no-op, and both
          # languages agree. GetLongPathNameW is used because it expands 8.3 deterministically in
          # BOTH directions of this comparison, which is the property actually required here.
          # Single-line signature deliberately: a PowerShell here-string needs its delimiters at
          # column 0, which would terminate this YAML block scalar.
          if (-not ('Win32.LongPath' -as [type])) {
            $sig = '[DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] public static extern uint GetLongPathNameW(string lpszShortPath, System.Text.StringBuilder lpszLongPath, uint cchBuffer);'
            Add-Type -MemberDefinition $sig -Name 'LongPath' -Namespace 'Win32' | Out-Null
          }
          function Resolve-LongPath([string]$p) {
            $sb = New-Object System.Text.StringBuilder 32767
            $n = [Win32.LongPath]::GetLongPathNameW($p, $sb, $sb.Capacity)
            if ($n -eq 0 -or $n -gt $sb.Capacity) { return $null }
            return $sb.ToString()
          }

          $rt = $env:RUNNER_TEMP
          if ([string]::IsNullOrWhiteSpace($rt)) { Write-Host "FAIL: RUNNER_TEMP is not set"; exit 1 }
          if (-not [System.IO.Path]::IsPathRooted($rt)) { Write-Host "FAIL: RUNNER_TEMP '$rt' is not absolute"; exit 1 }
          if (-not (Test-Path -LiteralPath $rt -PathType Container)) { Write-Host "FAIL: RUNNER_TEMP '$rt' is not an existing directory"; exit 1 }
          $rtLong = Resolve-LongPath ([System.IO.Path]::GetFullPath($rt))
          if ([string]::IsNullOrWhiteSpace($rtLong)) { Write-Host "FAIL: could not resolve RUNNER_TEMP to a long path"; exit 1 }
          $rtLong = $rtLong.TrimEnd('\')
          if ($rtLong -match '~\d') { Write-Host "FAIL: RUNNER_TEMP still carries an 8.3 component after long-path resolution: '$rtLong'"; exit 1 }

          # A DEDICATED SIBLING of gate-evidence. Kept separate so fixture residue never reaches the
          # uploaded guardrail-windows-evidence artifact.
          $execRoot = Join-Path $rtLong 'wiki-executor-evidence'

          # Must be ABSENT. No -Force, no reuse, no fallback: a pre-existing directory here means
          # something else owns it, and silently adopting it is how a run inherits foreign state.
          if (Test-Path -LiteralPath $execRoot) { Write-Host "FAIL: executor evidence root already exists: '$execRoot'"; exit 1 }
          try { New-Item -ItemType Directory -Path $execRoot -ErrorAction Stop | Out-Null }
          catch { Write-Host "FAIL: could not create executor evidence root '$execRoot': $($_.Exception.Message)"; exit 1 }

          # REOPEN and validate what actually landed, rather than trusting the create.
          $created = Get-Item -LiteralPath $execRoot -Force -ErrorAction SilentlyContinue
          if ($null -eq $created) { Write-Host "FAIL: executor evidence root vanished after creation"; exit 1 }
          if (-not ($created -is [System.IO.DirectoryInfo])) { Write-Host "FAIL: executor evidence root is not a directory"; exit 1 }
          if (($created.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
            Write-Host "FAIL: executor evidence root is a reparse point"; exit 1
          }
          if ($created.LinkType) { Write-Host "FAIL: executor evidence root is a link ($($created.LinkType))"; exit 1 }

          $execLong = Resolve-LongPath $created.FullName
          if ([string]::IsNullOrWhiteSpace($execLong)) { Write-Host "FAIL: could not resolve executor evidence root to a long path"; exit 1 }
          $execLong = $execLong.TrimEnd('\')
          if ($execLong -match '~\d') { Write-Host "FAIL: executor evidence root carries an 8.3 component: '$execLong'"; exit 1 }

          # Direct parent must be RUNNER_TEMP itself -- a sibling, not a descendant of something else.
          $execParent = ([System.IO.Path]::GetDirectoryName($execLong)).TrimEnd('\')
          if ($execParent -ne $rtLong) {
            Write-Host "FAIL: executor evidence root parent '$execParent' is not RUNNER_TEMP '$rtLong'"; exit 1
          }

          # Must be neither gate-evidence nor contained beneath it.
          $gateLong = (Join-Path $rtLong 'gate-evidence').TrimEnd('\')
          if ($execLong -eq $gateLong) { Write-Host "FAIL: executor evidence root collides with gate-evidence"; exit 1 }
          if ($execLong.StartsWith($gateLong + '\', [System.StringComparison]::OrdinalIgnoreCase)) {
            Write-Host "FAIL: executor evidence root is beneath gate-evidence"; exit 1
          }
          Write-Host "Executor evidence root: $execLong"

          # ---- Windows PowerShell 5.1 Desktop ----
          $major = $PSVersionTable.PSVersion.Major
          $edition = $PSVersionTable.PSEdition
          Write-Host "PSVersion=$($PSVersionTable.PSVersion) PSEdition=$edition"
          if ($major -ne 5) { Write-Host "FAIL: expected PowerShell major version 5, got $major"; exit 1 }
          if ($edition -ne 'Desktop') { Write-Host "FAIL: expected PSEdition Desktop, got $edition"; exit 1 }
          $psCmd = Get-Command powershell.exe -ErrorAction SilentlyContinue
          if ($null -eq $psCmd) { Write-Host "FAIL: powershell.exe did not resolve"; exit 1 }
          $psAbs = $psCmd.Source
          if ([string]::IsNullOrWhiteSpace($psAbs) -or -not (Test-Path -LiteralPath $psAbs -PathType Leaf)) {
            Write-Host "FAIL: powershell.exe resolved to a path that does not exist: '$psAbs'"; exit 1
          }
          $psIdentity = "$($PSVersionTable.PSVersion) $edition @ $psAbs"
          Write-Host "Authenticated PowerShell: $psIdentity"

          # ---- Python: EXACT toolcache identity, derived from setup-python's pythonLocation ----
          # Bare `python` is never executed. PATH can resolve to a different interpreter than the one
          # actions/setup-python provisioned; binding the toolcache path makes the identity exact.
          $loc = $env:pythonLocation
          if ([string]::IsNullOrWhiteSpace($loc)) {
            Write-Host "FAIL: pythonLocation is not set; setup-python did not provision an interpreter"; exit 1
          }
          if (-not (Test-Path -LiteralPath $loc -PathType Container)) {
            Write-Host "FAIL: pythonLocation '$loc' is not an existing directory"; exit 1
          }
          $locFull = [System.IO.Path]::GetFullPath($loc)

          # Exactly one candidate directly under the boundary, else the identity is AMBIGUOUS.
          $cands = @(Get-ChildItem -LiteralPath $locFull -Filter 'python.exe' -File -ErrorAction SilentlyContinue)
          if ($cands.Count -eq 0) { Write-Host "FAIL: no python.exe directly under '$locFull'"; exit 1 }
          if ($cands.Count -gt 1) { Write-Host "FAIL: AMBIGUOUS python identity -- $($cands.Count) candidates under '$locFull'"; exit 1 }

          $pyAbs = [System.IO.Path]::GetFullPath($cands[0].FullName)
          if (-not [System.IO.Path]::IsPathRooted($pyAbs)) { Write-Host "FAIL: resolved python path is not absolute: '$pyAbs'"; exit 1 }
          if (-not (Test-Path -LiteralPath $pyAbs -PathType Leaf)) { Write-Host "FAIL: resolved python path does not exist: '$pyAbs'"; exit 1 }

          # Boundary check. Honest about its scope: $pyAbs was enumerated FROM $locFull, so this is
          # a defence-in-depth string containment check, not a traversal defence -- there is no
          # traversal input, and StartsWith does not prove containment against a junction pointing
          # outside the toolcache. The real identity proof is executing the interpreter below.
          $boundary = $locFull.TrimEnd('\') + '\'
          if (-not $pyAbs.StartsWith($boundary, [System.StringComparison]::OrdinalIgnoreCase)) {
            Write-Host "FAIL: resolved python '$pyAbs' is not beneath the pythonLocation boundary '$boundary'"; exit 1
          }

          # Version from the interpreter itself, as a tuple -- not by parsing banner text.
          # Do NOT pipe a native command into Select-Object before reading $LASTEXITCODE.
          # `Select-Object -First 1` stops the upstream pipeline before the process is reaped, and
          # Windows PowerShell 5.1 then records $LASTEXITCODE as -1 instead of the real code --
          # measured 20 of 20 runs on the 5.1 Desktop host this job asserts. The earlier form made
          # this gate fail before any test ran, on every run. Let the command complete, capture the
          # code, THEN reduce. `-Last 1` also stops an interleaved stderr line landing first.
          $pyVerRaw = & $pyAbs -c "import sys; print('{}.{}'.format(sys.version_info[0], sys.version_info[1]))" 2>&1
          $pyRc = $LASTEXITCODE
          if ($pyRc -ne 0) { Write-Host "FAIL: bound python did not execute (exit $pyRc)"; exit 1 }
          $pyVer = "$(@($pyVerRaw) | Select-Object -Last 1)".Trim()
          if ($pyVer -ne '3.11') { Write-Host "FAIL: bound python reports '$pyVer', expected exactly '3.11'"; exit 1 }
          $pyFullRaw = & $pyAbs -c "import sys; print(sys.version.split()[0])" 2>&1
          $pyFullRc = $LASTEXITCODE
          if ($pyFullRc -ne 0) { Write-Host "FAIL: bound python failed reporting its full version (exit $pyFullRc)"; exit 1 }
          $pyFull = "$(@($pyFullRaw) | Select-Object -Last 1)".Trim()
          $pyIdentity = "$pyFull @ $pyAbs"
          Write-Host "Authenticated Python: $pyIdentity"

          # Recorded, never used: if PATH would have resolved elsewhere, say so rather than rely on it.
          $pathPy = (Get-Command python -ErrorAction SilentlyContinue)
          $pathPyNote = if ($null -eq $pathPy) { 'PATH python: (unresolved)' } else { "PATH python: $($pathPy.Source)" }
          Write-Host $pathPyNote

          @(
            "powershell_identity=$psIdentity",
            "python_identity=$pyIdentity",
            "python_boundary=$locFull",
            "executor_evidence_root=$execLong",
            $pathPyNote
          ) | Set-Content -Encoding ASCII (Join-Path $ev 'identity.txt')

          "SSTAC_WIKI_EXECUTOR_EVIDENCE_ROOT=$execLong" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREFLIGHT_POWERSHELL=$psAbs"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PREFLIGHT_PYTHON=$pyAbs"       | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_PS_IDENTITY=$psIdentity"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_PY_IDENTITY=$pyIdentity"  | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # STEP 2 -- run the tests and assert the FIVE-CLAUSE execution contract.
      # Clause 5 assumes each named test's "... ok" lands unsplit on one line. Verified on the real
      # suite (93/93 clean), but the tests spawn PowerShell children: one leaking stderr mid-line
      # could split the line and turn clause 5 red for a plumbing reason rather than a real defect.
      #   1-4 arithmetic: executed >= N, failures = 0, errors = 0, skips = 0
      #   5   identity:   the named load-bearing tests are observed to have EXECUTED AND PASSED
      # Count alone is never identity evidence: "Ran 93 ... OK (skipped=93)" would satisfy a count
      # clause while having tested nothing.
      #
      # N and the named list are PROVISIONAL for this tip and MUST be re-derived when item C adds
      # tests. N = 93 was derived from an actual `unittest discover` run, not from a `def test_` grep.
      - name: Run guardrail wrapper contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $N = 93
          $named = @(
            'test_guardrail_pins_a_single_shared_drain_budget',
            'test_exact_environment_bounded_drain_survives_a_descendant_holding_the_pipe'
          )

          $py = $env:PREFLIGHT_PYTHON
          if ([string]::IsNullOrWhiteSpace($py) -or -not (Test-Path -LiteralPath $py -PathType Leaf)) {
            Write-Host "FAIL: PREFLIGHT_PYTHON is not bound to an existing file: '$py'"; exit 1
          }
          Write-Host "Using bound Python: $py"

          # Fail closed if the evidence root did not survive step 1. Note the harness's own
          # normcase parent-role assert (test_wrapper_contracts.py) is DORMANT when the variable is
          # unset -- which is why it did not fire on the failing run. Binding the variable activates
          # that assert AND removes the representation ambiguity that broke the ordinal comparisons
          # in check_orphans.ps1. An unset or altered value reintroduces both.
          $execRoot = $env:SSTAC_WIKI_EXECUTOR_EVIDENCE_ROOT
          if ([string]::IsNullOrWhiteSpace($execRoot)) { Write-Host "FAIL: SSTAC_WIKI_EXECUTOR_EVIDENCE_ROOT is not bound"; exit 1 }
          if (-not (Test-Path -LiteralPath $execRoot -PathType Container)) { Write-Host "FAIL: executor evidence root '$execRoot' is not an existing directory"; exit 1 }
          if ($execRoot -match '~\d') { Write-Host "FAIL: executor evidence root carries an 8.3 component: '$execRoot'"; exit 1 }
          Write-Host "Using executor evidence root: $execRoot"

          $ev = Join-Path $env:RUNNER_TEMP 'gate-evidence'
          New-Item -ItemType Directory -Path $ev -Force | Out-Null
          $outFile = Join-Path $ev 'unittest_stdout.txt'
          $errFile = Join-Path $ev 'unittest_stderr.txt'

          # unittest writes its progress lines, the `Ran N tests` summary and the OK/FAILED verdict
          # to STDERR. Capture BOTH streams to files: a step redirecting stdout alone gets an empty
          # buffer, and `2>&1` in a pipeline would trip this shell's ErrorActionPreference.
          $pyArgs = @(
            '-m','unittest','discover',
            '--start-directory','tooling/wiki/tests',
            '--top-level-directory','tooling/wiki/tests',
            '--pattern','test_wrapper_contracts.py',
            '--verbose'
          )
          $t0 = (Get-Date).ToString('o')
          $proc = Start-Process -FilePath $py -ArgumentList $pyArgs -NoNewWindow -Wait -PassThru `
                    -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $t1 = (Get-Date).ToString('o')
          $exit = if ($null -eq $proc) { $null } else { $proc.ExitCode }

          $output = @()
          foreach ($f in @($outFile, $errFile)) {
            if (Test-Path -LiteralPath $f) { $output += (Get-Content -LiteralPath $f) }
          }
          $output | ForEach-Object { Write-Host $_ }

          $failed = $false
          function Fail([string]$m) { Write-Host "ASSERTION FAILED: $m"; $script:failed = $true }

          # Necessary but NOT sufficient -- recorded so nobody later mistakes it for the gate.
          if ($null -eq $exit) { Fail "python process failed to launch (no exit code)" }
          elseif ($exit -ne 0) { Fail "python exited $exit" }

          # Clause 1 -- executed >= N
          $ran = -1
          $ranLine = $output | Where-Object { $_ -match '^Ran (\d+) test' } | Select-Object -Last 1
          if (-not $ranLine) { Fail "no 'Ran N tests' summary line found in captured output" }
          else {
            $ran = [int]([regex]::Match($ranLine, '^Ran (\d+) test').Groups[1].Value)
            Write-Host "executed=$ran required>=$N"
            if ($ran -lt $N) { Fail "executed $ran is below the frozen lower bound $N (silent test loss)" }
          }

          # Clauses 2-4 -- failures = 0, errors = 0, skips = 0
          $skipped = @($output | Where-Object { $_ -match '\.\.\. skipped' }).Count
          $failLines = @($output | Where-Object { $_ -match '\.\.\. (FAIL|ERROR)$' }).Count
          if ($skipped -ne 0) { Fail "skips must be 0, found $skipped (a skipped guardrail test is the Linux-shaped false green)" }
          if ($failLines -ne 0) { Fail "failures/errors must be 0, found $failLines" }
          $summary = $output | Where-Object { $_ -match '^(OK|FAILED)' } | Select-Object -Last 1
          if (-not $summary) { Fail "no OK/FAILED verdict line found" }
          elseif ($summary -notmatch '^OK\s*$') { Fail "verdict line was '$summary', expected exactly 'OK'" }

          # Clause 5 -- IDENTITY. Assert PRESENCE, not absence: the check must fail when a named
          # test is missing from the output, which is the existence counterpart an absence-only
          # check lacks. Anchored on the method name (verified: 93 names, 0 strict-prefix pairs).
          $namedOk = 0
          foreach ($t in $named) {
            $hit = $output | Where-Object { $_ -match ("^" + [regex]::Escape($t) + " ") -and $_ -match 'ok\s*$' }
            if ($hit) { Write-Host "named test executed and passed: $t"; $namedOk++ }
            else { Fail "named load-bearing test did not appear as passed in the output: $t" }
          }

          "GATE_TESTS_EXIT=$exit"       | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_EXECUTED=$ran"          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_SKIPS=$skipped"         | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_FAILERR=$failLines"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_NAMED_OK=$namedOk/$($named.Count)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_TESTS_START=$t0"        | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_TESTS_END=$t1"          | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($failed) { Write-Host "RESULT: FAIL"; exit 1 }
          Write-Host "RESULT: PASS (five-clause contract satisfied)"

      # STEP 3 -- run the smoke script through the SAME authenticated interpreter, not a bare
      # `powershell`, so this step cannot silently use a different host than step 1 verified.
      - name: Run guardrail smoke script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $interp = $env:PREFLIGHT_POWERSHELL
          if ([string]::IsNullOrWhiteSpace($interp) -or -not (Test-Path -LiteralPath $interp -PathType Leaf)) {
            Write-Host "FAIL: PREFLIGHT_POWERSHELL is not bound to an existing path: '$interp'"; exit 1
          }
          Write-Host "Using authenticated interpreter: $interp"

          $ev = Join-Path $env:RUNNER_TEMP 'gate-evidence'
          New-Item -ItemType Directory -Path $ev -Force | Out-Null
          $smokeOut = Join-Path $ev 'smoke_stdout.txt'
          $smokeErr = Join-Path $ev 'smoke_stderr.txt'
          $proc = Start-Process -FilePath $interp `
                    -ArgumentList @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','tooling\wiki\guardrail_smoke.ps1') `
                    -NoNewWindow -Wait -PassThru -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          $exit = if ($null -eq $proc) { $null } else { $proc.ExitCode }

          $out = @()
          foreach ($f in @($smokeOut, $smokeErr)) {
            if (Test-Path -LiteralPath $f) { $out += (Get-Content -LiteralPath $f) }
          }
          $out | ForEach-Object { Write-Host $_ }

          $passCount = @($out | Where-Object { $_ -match '^PASS: ' }).Count
          Write-Host "smoke exit=$exit passLines=$passCount required=5"
          "GATE_SMOKE_EXIT=$exit"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_SMOKE_PASS=$passCount" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($null -eq $exit) { Write-Host "ASSERTION FAILED: smoke process failed to launch"; exit 1 }
          if ($exit -ne 0) { Write-Host "ASSERTION FAILED: smoke script exited $exit"; exit 1 }
          if ($passCount -ne 5) { Write-Host "ASSERTION FAILED: expected exactly 5 PASS lines, found $passCount"; exit 1 }
          Write-Host "RESULT: PASS (smoke exit 0, 5 PASS lines)"

      # Summary of what was authenticated and what actually executed. Identities and counts only --
      # no environment dumps, no secrets, no unrelated runner files.
      - name: Job summary
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          function V($x) { if ([string]::IsNullOrWhiteSpace($x)) { '(not reached)' } else { $x } }
          $rows = @(
            "| Item | Value |",
            "|---|---|",
            "| PowerShell identity | $(V $env:GATE_PS_IDENTITY) |",
            "| Python identity | $(V $env:GATE_PY_IDENTITY) |",
            "| Executed tests | $(V $env:GATE_EXECUTED) (required >= 93) |",
            "| Failures + errors | $(V $env:GATE_FAILERR) (required 0) |",
            "| Skips | $(V $env:GATE_SKIPS) (required 0) |",
            "| Named load-bearing tests passed | $(V $env:GATE_NAMED_OK) |",
            "| Smoke PASS lines | $(V $env:GATE_SMOKE_PASS) (required 5) |",
            "| unittest native exit | $(V $env:GATE_TESTS_EXIT) |",
            "| smoke native exit | $(V $env:GATE_SMOKE_EXIT) |",
            "| unittest start / end | $(V $env:GATE_TESTS_START) / $(V $env:GATE_TESTS_END) |"
          )
          "## Guardrail Tests (Windows PowerShell 5.1)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          ""                                            | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # Durable evidence. `identity.txt` is written by step 1, so if the job got past runtime
      # authentication at all the directory is non-empty -- which is what makes `error` the correct
      # if-no-files-found semantics here rather than a nuisance failure.
      - name: Upload guardrail gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-windows-evidence
          path: ${{ runner.temp }}/gate-evidence
          retention-days: 14
          if-no-files-found: error
