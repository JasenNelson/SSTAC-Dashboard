# Matrix R2 disposable local full-stack preview: Supabase CLI config TEMPLATE (hash-pinned in manifest.json).
# bootstrap.mjs `prepare` renders it into one run's directory, .tmp/r2-fullstack/runs/<run id>/supabase/,
# replacing only the @@...@@ placeholders with that run's own project id and port block, so every
# run gets new containers, volumes and ports. The CLI has no bind-address setting: Docker Desktop must
# publish on 127.0.0.1 (daemon.json "ip": "127.0.0.1"); the wrapper refuses to start otherwise and
# re-checks the bindings before anything is loaded. The repo's own supabase/ folder is never used.
project_id = "@@PROJECT_ID@@"

[api]
enabled = true
port = @@API_PORT@@
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = @@DB_PORT@@
shadow_port = @@SHADOW_PORT@@
# Production reports server_version_num 170004.
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:@@APP_PORT@@"
additional_redirect_urls = ["http://127.0.0.1:@@APP_PORT@@"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
